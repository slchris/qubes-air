# Qubes Air - Security Scanning Workflow
#
# 安全扫描: gosec, trivy, secrets scanning

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 UTC 时间 00:00 运行
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  # Go 安全扫描 (gosec)
  gosec:
    name: GoSec Security Scan
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: console/backend/go.sum

      - name: Run Gosec
        working-directory: console/backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          # No -no-fail: a finding must fail the job, not just be uploaded.
          # -exclude-generated: internal/transport/relaypb/*.pb.go is emitted by
          # protoc-gen-go and not hand-maintained, so its unsafe.Pointer use
          # (G103) is protoc's output rather than code anyone here edits. Same
          # flag as `make gosec-ci`, so local and CI scan the same files.
          gosec -fmt sarif -out gosec-results.sarif -exclude-generated ./...

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: console/backend/gosec-results.sarif
          category: gosec
        if: always()

  # Trivy 容器/依赖扫描
  trivy:
    name: Trivy Vulnerability Scan
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy (filesystem mode)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        if: always()

  # 密钥泄露检测
  secrets-scan:
    name: Secret Scanning
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action only auto-detects `gitleaks.toml` without the leading dot
          # (README: "create a `gitleaks.toml` at the root of the repo"), while
          # the gitleaks CLI discovers `.gitleaks.toml`. Point the action at the
          # one file the CLI uses instead of keeping two copies in sync.
          GITLEAKS_CONFIG: .gitleaks.toml
