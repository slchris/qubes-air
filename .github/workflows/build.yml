# Qubes Air - Build Workflow
#
# 构建 Go 后端和 Svelte 前端

name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # Go 后端构建
  build-backend:
    name: Build Go Backend
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: console/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v -o bin/qubes-air-console ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: console/backend/bin/qubes-air-console
          retention-days: 7

  # Svelte 前端构建
  build-frontend:
    name: Build Svelte Frontend
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: console/frontend/dist
          retention-days: 7

  # Agent Debian 包安装/升级冒烟 (Docker, 与 scripts/test-agent-deb.sh 相同入口)
  agent-package:
    name: Agent package install smoke
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build and smoke-test the .deb
        run: scripts/test-agent-deb.sh
