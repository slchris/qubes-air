# Qubes Air - Build Workflow
#
# 构建 Go 后端和 Svelte 前端

name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # Go 后端构建
  build-backend:
    name: Build Go Backend
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: console/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v -o bin/qubes-air-console ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-binary
          path: console/backend/bin/qubes-air-console
          retention-days: 7

  # Svelte 前端构建
  build-frontend:
    name: Build Svelte Frontend
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Warnings fail the build too (see lint.yml's Svelte Check).
      - name: Type check
        run: npm run check -- --fail-on-warnings

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: console/frontend/dist
          retention-days: 7

  # 浏览器端到端测试 (Playwright, 与 `make frontend-e2e` 相同入口)。API 由
  # console/frontend/e2e 里的 page.route 模拟: 证明 UI 调 API 的方式, 不证明真机可用。
  frontend-e2e:
    name: Frontend E2E (mocked API)
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Installs npm packages and a browser; the token only needs to read the repo.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: console/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Chromium build is the one the @playwright/test version pinned in
      # package-lock.json expects; --with-deps adds its system libraries.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # GitHub sets CI=true, which makes playwright.config.ts refuse test.only.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: console/frontend/test-results
          retention-days: 7

  # Agent Debian 包安装/升级冒烟 (Docker, 与 scripts/test-agent-deb.sh 相同入口)
  agent-package:
    name: Agent package install smoke
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and smoke-test the .deb
        run: scripts/test-agent-deb.sh
