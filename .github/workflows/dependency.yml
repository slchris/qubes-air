# Qubes Air - Dependency Management Workflow
#
# 依赖更新检查和漏洞扫描

name: Dependencies

on:
  push:
    branches: [main]
    paths:
      - 'console/backend/go.mod'
      - 'console/backend/go.sum'
      - 'console/frontend/package.json'
      - 'console/frontend/package-lock.json'
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 时间 06:00 运行
    - cron: '0 6 * * *'

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # Go 依赖检查
  go-dependencies:
    name: Go Dependencies
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: console/backend/go.sum

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check for vulnerabilities
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

      - name: List outdated dependencies
        run: go list -u -m all

  # Node.js 依赖检查
  npm-dependencies:
    name: NPM Dependencies
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: console/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities
        run: npm audit --audit-level=high

      - name: Check for outdated packages (report only)
        # Informational, not a gate: `npm outdated` exits 1 whenever upgrades
        # exist — that is its report, not a failure. The gate for dependencies
        # here is the `npm audit --audit-level=high` step above.
        # It no longer ends in `|| true` (AGENTS.md §2.4 forbids discarding the
        # exit status); tolerating the step is stated where a reviewer can see it,
        # and scripts/check-workflow-gates.mjs rejects `|| true` outright.
        run: npm outdated
        continue-on-error: true

  # Dependabot 配置验证
  dependabot-config:
    name: Validate Dependabot Config
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04
    # Installs and runs a PyPI package; the token only needs to read the repo.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install check-jsonschema
        run: python -m pip install check-jsonschema==0.36.2

      # Schema validation, not an existence check: `test -f` stayed green while
      # the file carried two schema errors (an empty `registries:` and the
      # removed `reviewers:` option). The Dependabot schema is the SchemaStore
      # copy vendored in the pinned check-jsonschema, so no network fetch.
      - name: Validate Dependabot config against its schema
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml

  # 许可证合规检查
  license-check:
    name: License Compliance
    # Pinned: ubuntu-latest turns 26.04 on 2026-10-19 (untested here); unpin once an ubuntu-26.04 trial run passes.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: console/backend/go.sum

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check Go licenses
        # Non-blocking ON PURPOSE, and stated here rather than hidden in the
        # command: this step was `... || true`, which discarded the exit status so
        # the step went green whatever go-licenses reported (AGENTS.md §2.4).
        # Removal of `|| true` does not change the job's outcome — the step already
        # carried continue-on-error — but a failure now shows as a failed step
        # instead of a green one. Whether to make it blocking is an open issue in
        # docs/sprint-1/partitions/p2-nongo.md (needs a CI-env run to confirm).
        run: |
          cd console/backend
          go-licenses check ./... --disallowed_types=forbidden,restricted
        continue-on-error: true
