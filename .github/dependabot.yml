# Qubes Air - Dependabot Configuration
#
# 自动依赖更新配置

version: 2

# Validated in CI (dependency.yml, "Validate Dependabot Config") against the
# SchemaStore Dependabot schema vendored in check-jsonschema, which is
# community-maintained, not published by GitHub. Do not add `registries:`
# without an entry -- an empty key is null, which the schema rejects -- and
# do not add `reviewers:`: GitHub removed that option; Dependabot requests
# reviews from CODEOWNERS instead.

updates:
  # Go 依赖
  - package-ecosystem: "gomod"
    directory: "/console/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # NPM 依赖
  - package-ecosystem: "npm"
    directory: "/console/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-dev:
        patterns:
          - "*"
        dependency-type: "development"
      npm-prod:
        patterns:
          - "*"
        dependency-type: "production"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
